  <g stroke="#4B2745" stroke-width="3.4"><ellipse cx="80" cy="184" rx="15" ry="8.5"/><ellipse cx="120" cy="184" rx="15" ry="8.5"/></g>
  <!-- rounded arms: even thickness, inner-edge shade -->
  <ellipse cx="22" cy="130" rx="14" ry="24" transform="rotate(8 22 130)" fill="#FDFDFF"/><g clip-path="url(#armL)"><ellipse cx="22" cy="130" rx="14" ry="24" transform="rotate(8 22 130)" stroke="#CBD5EA" stroke-width="8" opacity=".42"/><path d="M12 112Q10 126 15 140" stroke="#fff" stroke-width="4" opacity=".9"/></g><ellipse cx="22" cy="130" rx="14" ry="24" transform="rotate(8 22 130)" stroke="#4B2745" stroke-width="3.4"/>
  <ellipse cx="178" cy="130" rx="14" ry="24" transform="rotate(-8 178 130)" fill="#FDFDFF"/><g clip-path="url(#armR)"><ellipse cx="178" cy="130" rx="14" ry="24" transform="rotate(-8 178 130)" stroke="#CBD5EA" stroke-width="8" opacity=".42"/><path d="M168 112Q166 126 171 140" stroke="#fff" stroke-width="4" opacity=".9"/></g><ellipse cx="178" cy="130" rx="14" ry="24" transform="rotate(-8 178 130)" stroke="#4B2745" stroke-width="3.4"/>
