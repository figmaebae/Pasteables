  <path d="M100 64C150 62 176 92 176 128C176 160 150 180 100 180C50 180 24 160 24 128C24 92 50 62 100 64Z" fill="#FDFDFF"/>
  <g clip-path="url(#body)">
    <path d="M100 64C150 62 176 92 176 128C176 160 150 180 100 180C50 180 24 160 24 128C24 92 50 62 100 64Z" stroke="#D5DEEF" stroke-width="16" opacity=".32"/>
